{% extends 'base.html' %}

{% block content %}
<section class="page">
    {% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}

    <form method="POST" class="auth-form">
        {% csrf_token %}
<h1>Регистрация</h1>
        <input name="username" placeholder="Логин">

        <input type="password"
               name="password"
               placeholder="Пароль">

        <button>Создать аккаунт</button>
    </form>
</section>
{% endblock %}
